<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="960" height="150" role="img" aria-label="Stack: TypeScript, React, Next.js, SvelteKit, Tailwind, PostgreSQL, Docker, Cloudflare, Vercel, Vitest, Playwright">
  <style>
    :root { --bg:#fef8ec; --elev:#f9f1e1; --line:#e6d7b8; --fg:#00404a; --subtle:#576c6d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#2e3440; --elev:#3b4252; --line:#4c566a; --fg:#eceff4; --subtle:#b2bccd; }
    }
    .bg { fill:var(--bg); }
    .mono { font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-ligatures:none; }
    .label { font-size:12px; letter-spacing:0.05em; text-transform:uppercase; fill:var(--subtle); }
    .pill rect { fill:var(--elev); stroke:var(--line); stroke-width:1; }
    .pill text { font-size:13px; font-weight:500; fill:var(--fg); }
    @media (prefers-reduced-motion: no-preference) {
      .pill { animation: rise 250ms cubic-bezier(0.2,0,0,1) both; animation-delay: calc(var(--i) * 70ms); }
      .pill rect { animation: glow 6s ease-in-out infinite; animation-delay: calc(2s + var(--i) * 350ms); }
    }
    @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    @keyframes glow { 0%, 12%, 100% { stroke:var(--line); } 6% { stroke:var(--fg); } }
  </style>
  <rect class="bg" width="960" height="150"/>
  <text class="mono label" x="64" y="30">Stack</text>
  <g class="pill mono" style="--i:0"><rect x="64" y="44" width="106" height="32" rx="8"/><text x="117" y="65" text-anchor="middle">TypeScript</text></g>
  <g class="pill mono" style="--i:1"><rect x="180" y="44" width="67" height="32" rx="8"/><text x="213" y="65" text-anchor="middle">React</text></g>
  <g class="pill mono" style="--i:2"><rect x="257" y="44" width="83" height="32" rx="8"/><text x="298" y="65" text-anchor="middle">Next.js</text></g>
  <g class="pill mono" style="--i:3"><rect x="350" y="44" width="98" height="32" rx="8"/><text x="399" y="65" text-anchor="middle">SvelteKit</text></g>
  <g class="pill mono" style="--i:4"><rect x="458" y="44" width="90" height="32" rx="8"/><text x="503" y="65" text-anchor="middle">Tailwind</text></g>
  <g class="pill mono" style="--i:5"><rect x="64" y="88" width="106" height="32" rx="8"/><text x="117" y="109" text-anchor="middle">PostgreSQL</text></g>
  <g class="pill mono" style="--i:6"><rect x="180" y="88" width="75" height="32" rx="8"/><text x="217" y="109" text-anchor="middle">Docker</text></g>
  <g class="pill mono" style="--i:7"><rect x="265" y="88" width="106" height="32" rx="8"/><text x="318" y="109" text-anchor="middle">Cloudflare</text></g>
  <g class="pill mono" style="--i:8"><rect x="381" y="88" width="75" height="32" rx="8"/><text x="418" y="109" text-anchor="middle">Vercel</text></g>
  <g class="pill mono" style="--i:9"><rect x="466" y="88" width="75" height="32" rx="8"/><text x="503" y="109" text-anchor="middle">Vitest</text></g>
  <g class="pill mono" style="--i:10"><rect x="551" y="88" width="106" height="32" rx="8"/><text x="604" y="109" text-anchor="middle">Playwright</text></g>
</svg>
