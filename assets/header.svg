<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-labelledby="t d">
  <title id="t">etienne.</title>
  <desc id="d">Etienne de Lange, full-stack engineer in Gqeberha, South Africa</desc>
  <style>
    :root { --bg:#fef8ec; --line:#e6d7b8; --fg:#00404a; --muted:#3f6265; --accent:#007386; --dotstroke:#00404a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#2e3440; --line:#434c5e; --fg:#eceff4; --muted:#b2bccd; --accent:#8fc4d3; --dotstroke:#f5d90a; }
    }
    .bg { fill:var(--bg); }
    .contour { fill:none; stroke:var(--line); stroke-width:1; }
    .mono { font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-ligatures:none; }
    .word { font-weight:700; font-size:64px; letter-spacing:-0.02em; fill:var(--fg); }
    .dot { fill:#f5d90a; stroke:var(--dotstroke); stroke-width:2; paint-order:stroke; }
    .tag { font-size:16px; fill:var(--muted); }
    .prompt { fill:var(--accent); }
    .cursor { fill:var(--accent); }
    @media (prefers-reduced-motion: no-preference) {
      .drift { animation: drift 28s ease-in-out infinite alternate; }
      .drift.b { animation-duration:36s; animation-direction:alternate-reverse; }
      .reveal { animation: reveal 1.6s steps(44, end) 0.5s both; }
      .word { animation: rise 0.6s cubic-bezier(0.2,0,0,1) both; }
      
      .cursor { animation: move 1.6s steps(44, end) 0.5s both, blink 1.1s steps(1) 2.1s infinite; }
    }
    @keyframes drift  { from { transform:translate(0,0); } to { transform:translate(-26px,10px); } }
    @keyframes reveal { from { width:0; } to { width:440px; } }
    @keyframes rise   { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes move   { from { transform:translateX(-426px); } to { transform:none; } }
    @keyframes blink  { 50% { opacity:0; } }
  </style>
  <defs>
    <clipPath id="type"><rect class="reveal" x="86" y="118" width="440" height="40"/></clipPath>
  </defs>
  <rect class="bg" width="960" height="220"/>
  <g class="drift" transform-origin="760 110">
    <ellipse class="contour" cx="760" cy="110" rx="60" ry="34"/>
    <ellipse class="contour" cx="760" cy="110" rx="120" ry="68"/>
    <ellipse class="contour" cx="760" cy="110" rx="180" ry="102"/>
    <ellipse class="contour" cx="760" cy="110" rx="240" ry="136"/>
  </g>
  <g class="drift b" transform-origin="760 110">
    <ellipse class="contour" cx="760" cy="110" rx="90" ry="51"/>
    <ellipse class="contour" cx="760" cy="110" rx="150" ry="85"/>
    <ellipse class="contour" cx="760" cy="110" rx="210" ry="119"/>
  </g>
  <text class="mono word" x="64" y="104">etienne<tspan class="dot">.</tspan></text>
  <g class="mono tag">
    <text class="prompt" x="64" y="142">&gt;</text>
    <text x="86" y="142" clip-path="url(#type)">full-stack engineer · Gqeberha, South Africa</text>
    <rect class="cursor" x="512" y="128" width="9" height="18"/>
  </g>
</svg>
